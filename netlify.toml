# Netlify config for ReplAI — frontend only (FastAPI backend stays on Render).
# This file lives at the repo root so Netlify picks it up before navigating to the base dir.
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  base    = "frontend"
  command = "npm install --legacy-peer-deps && npm run build"
  # Path is RELATIVE to `base`, so this resolves to /opt/build/repo/frontend/.next
  publish = ".next"

[build.environment]
  NODE_VERSION  = "20"
  NPM_FLAGS     = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"

# Required Next.js runtime — adds SSR/ISR/route-handler support to Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy /backend/* to the FastAPI service hosted on Render.
# Browser only sees same-origin requests => no CORS, no mixed-content blocks.
[[redirects]]
  from   = "/backend/*"
  to     = "https://replai-fj5v.onrender.com/:splat"
  status = 200            # 200 = rewrite (proxy), 301/302 would be visible redirects
  force  = true

# Security headers for every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
